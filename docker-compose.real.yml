# =============================================================================
# KAIS AIGC Platform V6.0 — Real Integration Compose
# 4 services + PG + Redis, GPU-enabled gold-team, ComfyUI integration
#
# Usage:
#   docker compose -f docker-compose.real.yml up -d --build
#
# Smoke test compose is unaffected (docker-compose.smoke.yml)
# =============================================================================

services:
  # ─── Infrastructure ──────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    # 2026-08-23: gold-team 死伴重启不自启（thrash 硬重启后 :8002 断供
    # 整个下午）——infra 与引擎都钉 unless-stopped
    restart: unless-stopped
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data
      - /mnt/agents/output:/mnt/agents/output
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: reviewdb
    ports:
      - "5490:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Application Services ────────────────────────────────────────

  # core-backend: (REMOVED 2026-06-28 — use host tsx :10588)
  #   image: kais-core-backend:latest
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     NODE_ENV: production
  #     PORT: 8000
  #   volumes:
  #     - /mnt/agents/output:/mnt/agents/output
  #   healthcheck:
  #     test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # ─── Gold Team (REAL — built from source, GPU-enabled) ──────────

  gold-team:
    build:
      context: docker/gold-team
      dockerfile: Dockerfile.real
    image: kais-gold-team:real
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      REDIS_URL: redis://redis:6379/0
      # ComfyUI integration
      COMFYUI_ENABLED: ${COMFYUI_ENABLED:-true}
      COMFYUI_HOST: ${COMFYUI_HOST:-172.17.0.1}
      COMFYUI_PORT: ${COMFYUI_PORT:-8188}
      # Output
      OUTPUT_DIR: /mnt/agents/output
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Dreamina CLI engine (image generation; whitelist t2i=5.0/5.0lite,
      # i2i forced 4.6, resolution 2k — 2026-08-19)
      DREAMINA_CLI: /usr/local/bin/dreamina
      # Cloud job poll cap (was hardcoded 600s); keep TASK_TIMEOUT_SEC >= this
      CLOUD_JOB_MAX_WAIT_SEC: ${CLOUD_JOB_MAX_WAIT_SEC:-900}
      TASK_TIMEOUT_SEC: ${TASK_TIMEOUT_SEC:-960}
      # Hunyuan3D infer subprocess python (self-contained torch venv, 2026-09-06)
      KAIS_HUNYUAN3D_PYTHON: /opt/venv-hy3d/bin/python
    volumes:
      - /mnt/agents/output:/mnt/agents/output
      # Mount model cache to avoid re-downloading
      - model_cache:/home/kais/.cache
      # Mount dreamina CLI binary (ro) + OAuth state (rw — the CLI writes
      # its rolling logs into this dir; the actual auth token lives in
      # ~/.local/share/dreamina/byted_cli_user_token.json and is refreshed
      # in place, so that mount must be rw too)
      - /home/kai/.local/bin/dreamina:/usr/local/bin/dreamina:ro
      - /home/kai/.dreamina_cli:/home/kais/.dreamina_cli
      - /home/kai/.local/share/dreamina:/home/kais/.local/share/dreamina
      # kmc episode assets (i2i reference images) — same path inside the
      # container so host-side ref paths work verbatim (read-only)
      - /data/workspace/kais-hermes-skills:/data/workspace/kais-hermes-skills:ro
      # Hunyuan3D 3D arm (2026-09-06): shape/paint 权重真源(含 hy3dshape 代码树)
      # + 自包含 torch venv(--copies, 宿主 glibc 2.39 ≤ 容器 2.41)。
      # 引擎经 KAIS_HUNYUAN3D_PYTHON 调 venv python 起 infer 子进程。
      - /data/models:/data/models:ro
      - /data/workspace/kais-gold-team/venv-hy3d:/opt/venv-hy3d:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # GPU support — CDI UUID 锚定 (gpu-sched-hardening R3, 2026-09-06):
    # legacy device_ids:["1"] 是裸索引, PCIe 枚举漂移时指错卡 (docs/gpu-dual-3090-expansion.md)。
    # CDI 规格 = nvidia.com/gpu=<driver-UUID>, 真源 /opt/kais-gpu/gpu.conf RENDER_GEN1_UUID,
    # 值经环境变量注入 (宿主 .env / compose environment 均可)。
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids: ["nvidia.com/gpu=${KAIS_RENDER_GPU_UUID:-GPU-c5cdd49c-5a18-7d0b-2af5-1d2f642538c6}"]
              capabilities: [gpu]

  # ─── Review Platform ─────────────────────────────────────────────

  review-platform:
    image: kais-review-platform:latest
    ports:
      - "8091:8090"
    environment:
      PORT: 8090
      POSTGRES_URL: postgresql+asyncpg://review:review@postgres:5432/reviewdb
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-prod-api-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-prod-jwt-secret-change-me}
    volumes:
      - /mnt/agents/output:/mnt/agents/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# ─── Volumes ────────────────────────────────────────────────────────

volumes:
  redis_data:
  pg_data:
  model_cache:
