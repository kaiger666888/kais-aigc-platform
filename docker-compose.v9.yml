# =============================================================================
# KAIS AIGC Platform V9.0 — MEGAPAK 大一统 ComfyUI 双引擎架构
# =============================================================================
# 核心变更 (vs V8):
#   - ComfyUI 统一使用 yanwk/comfyui-boot:cu130-megapak-pt211 基线镜像
#   - 双引擎: comfyui-primary (3090/24GB) + comfyui-auxiliary (3060Ti/5.5GB 可用)
#   - 3090 职责: 视频生成(Wan 2.2/LTX)、3D(TRELLIS2)、FLUX、TRELLIS2 抽卡预览
#   - 3060Ti 职责: 放大(4x)、背景移除(RMBG)、SDXL 预处理、轻量推理
#   - 共享模型库 /data/models/comfyui (只读), 共享缓存, 输出按引擎隔离
#   - 增量节点通过 /data/workspace/comfyui-incremental-nodes 挂载
#   - 碎片容器全部清理, 统一到 compose 管理
#
# 架构:
#   ┌─────────────────────────────────────────────────┐
#   │ comfyui-primary (GPU 1/3090, :8188)            │
#   │ Wan 2.2 I2V 14B · FLUX · LTX · TRELLIS2 · 抽卡 │
#   │ 输出 → /mnt/agents/output/gpu1/                 │
#   ├─────────────────────────────────────────────────┤
#   │ comfyui-auxiliary (GPU 0/3060Ti, :8189)         │
#   │ 4x 放大 · RMBG · SDXL 预处理 · 轻量推理         │
#   │ 输出 → /mnt/agents/output/gpu0/                 │
#   ├─────────────────────────────────────────────────┤
#   │ kais-gold-team (GPU 1/3090, :8002)              │
#   │ 调度中枢: 路由到 primary/auxiliary               │
#   ├─────────────────────────────────────────────────┤
#   │ kais-core-backend · redis · audit-db · review    │
#   └─────────────────────────────────────────────────┘
#
# 用法:
#   全部启动:  docker compose -f docker-compose.v9.yml up -d
#   仅引擎:   docker compose -f docker-compose.v9.yml up -d comfyui-primary comfyui-auxiliary
#   仅核心:   docker compose -f docker-compose.v9.yml up -d core-backend gold-team
#   开发 mock: docker compose -f docker-compose.v9.yml --profile mock up -d
#   停止:      docker compose -f docker-compose.v9.yml down
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 0. comfyui-primary (3090 主生产引擎)
  # ---------------------------------------------------------------------------
  # 职责: 视频生成(Wan 2.2/1.4 I2V-T2V)、FLUX 图像、LTX-Video、
  #       TRELLIS2 3D 生成、抽卡预览、大模型推理
  # GPU: RTX 3090 24GB (device_ids: ["1"])
  # 端口: 8188
  # ---------------------------------------------------------------------------
  comfyui-primary:
    image: ${COMFYUI_BASE_IMAGE:-yanwk/comfyui-boot:cu130-megapak-pt211}
    container_name: comfyui-primary
    restart: unless-stopped
    ports:
      - "${COMFYUI_PRIMARY_PORT:-8188}:8188"
    environment:
      COMFYUI_LISTEN: "0.0.0.0"
      COMFYUI_PORT: 8188
      NVIDIA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,graphics"
      # Phase 36 follow-up: 强制 PyTorch 按 PCI 总线序,与 nvidia-smi 编号对齐
      # 容器内只看到 1 张 GPU (隔离后),cuda:0 永远是被隔离的那张,但保持显式声明以防 NVIDIA Container Toolkit 行为变化
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      TORCH_CUDA_DISABLE_TRITON: "1"
      TRANSFORMERS_CACHE: /tmp/hf_cache
      TORCH_HOME: /tmp/torch_cache
      OUTPUT_DIR: /mnt/agents/output/gpu1
      MODELS_DIR: /data/models/comfyui
      HF_ENDPOINT: "https://hf-mirror.com"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      NO_PROXY: "localhost,127.0.0.1,172.18.0.0/16"
      W2V_BERT_PATH: "/data/models/w2v-bert-2.0"
      CLI_ARGS: "--disable-metadata --lowvram --bf16-text-enc --bf16-unet --output-directory /mnt/agents/output/gpu1"
    volumes:
      - ${OUTPUT_DIR:-/mnt/agents/output}/gpu1:/mnt/agents/output/gpu1
      - ${DATA_MODELS_DIR:-/data/models/comfyui}:/root/ComfyUI/models:rw
      - ${ACESTEP_MODELS_DIR:-/data/models/ACE-Step1.5}:/root/ComfyUI/models/ace-step:ro
      - comfyui-user:/root/ComfyUI/user
      - /data/workspace/comfyui-incremental-nodes:/root/ComfyUI/custom_nodes/kais-incremental
      - /data/workspace/comfyui-incremental-nodes/ComfyUI-LTXVideo:/root/ComfyUI/custom_nodes/ComfyUI-LTXVideo
      - /data/workspace/comfyui-incremental-nodes/ComfyUI-TRELLIS2:/root/ComfyUI/custom_nodes/ComfyUI-TRELLIS2
      - /data/workspace/comfyui-incremental-nodes/ComfyUI_AIIA:/root/ComfyUI/custom_nodes/ComfyUI_AIIA
      - /data/workspace/comfyui-incremental-nodes/ComfyUI-kaola-IndexTTS2:/root/ComfyUI/custom_nodes/ComfyUI-kaola-IndexTTS2
      - /data/workspace/comfyui-incremental-nodes/facerestore_cf:/root/ComfyUI/custom_nodes/facerestore_cf
      - /data/workspace/comfyui-incremental-nodes/scripts/fix-kornia.sh:/root/user-scripts/pre-start.sh
      - /data/workspace/comfyui-incremental-nodes/scripts/install-insightface.sh:/root/user-scripts/install-insightface.sh
      - /data/workspace/comfyui-incremental-nodes/scripts/install-training-deps.sh:/root/user-scripts/install-training-deps.sh
      - /data/workspace/comfyui-incremental-nodes/scripts/install-aiia-deps.sh:/root/user-scripts/install-aiia-deps.sh
      - /data/workspace/comfyui-incremental-nodes/scripts/install-indextts2-deps.sh:/root/user-scripts/install-indextts2-deps.sh
      - /data/workspace/comfyui-incremental-nodes/scripts/install-facerestore-deps.sh:/root/user-scripts/install-facerestore-deps.sh
      - /data/models/cosyvoice:/root/ComfyUI/models/cosyvoice:rw
      - /data/models/IndexTTS-2:/root/ComfyUI/models/IndexTTS-2:ro
      - /data/models/w2v-bert-2.0:/data/models/w2v-bert-2.0:ro
      - comfyui-cache:/tmp/hf_cache
    networks:
      - kais-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    shm_size: "4g"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8188/system_stats')"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

  # ---------------------------------------------------------------------------
  # 1. comfyui-auxiliary (3060Ti 辅助引擎)
  # ---------------------------------------------------------------------------
  # 职责: 4x 放大/超分辨率、背景移除(RMBG)、SDXL 抽卡预处理、
  #       轻量图像后处理、音频预处理
  # GPU: RTX 3060Ti 8GB (可用 ~5.5GB, device_ids: ["0"])
  # 端口: 8189
  # ⚠️ 不可用于: 大模型推理 (>5GB VRAM)、视频生成、3D
  # ---------------------------------------------------------------------------
  comfyui-auxiliary:
    image: ${COMFYUI_BASE_IMAGE:-yanwk/comfyui-boot:cu130-megapak-pt211}
    container_name: comfyui-auxiliary
    restart: unless-stopped
    ports:
      - "${COMFYUI_AUX_PORT:-8189}:8188"
    environment:
      COMFYUI_LISTEN: "0.0.0.0"
      COMFYUI_PORT: 8188
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,graphics"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      TORCH_CUDA_DISABLE_TRITON: "1"
      TRANSFORMERS_CACHE: /tmp/hf_cache
      TORCH_HOME: /tmp/torch_cache
      OUTPUT_DIR: /mnt/agents/output/gpu0
      MODELS_DIR: /data/models/comfyui
      HF_ENDPOINT: "https://hf-mirror.com"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      NO_PROXY: "localhost,127.0.0.1,172.18.0.0/16"
      CLI_ARGS: "--lowvram"
    volumes:
      - ${OUTPUT_DIR:-/mnt/agents/output}/gpu0:/mnt/agents/output/gpu0
      - ${DATA_MODELS_DIR:-/data/models/comfyui}:/root/ComfyUI/models:ro
      - /data/workspace/comfyui-incremental-nodes:/root/ComfyUI/custom_nodes/kais-incremental
      - comfyui-cache:/tmp/hf_cache
    networks:
      - kais-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    shm_size: "2g"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8188/system_stats')"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

  # ---------------------------------------------------------------------------
  # 2. kais-core-backend — REMOVED 2026-06-28
  # 原因: host dev 后端 (tsx :10588) 是唯一生产实例, Docker 容器使用独立
  # DB volume, 数据不同步, 画布前端/管线均不连 :8000. 容器+volume 已清除.
  # 如需恢复: git revert this commit, 然后 docker compose up -d kais-core-backend
  # ---------------------------------------------------------------------------
  # 3. kais-gold-team (统一执行 Agent) — GPU 调度中枢
  # ---------------------------------------------------------------------------
  # 负责: 调用 ComfyUI primary/auxiliary + 云端引擎执行任务
  # GPU: 绑定 3090 (device_ids: ["1"])，用于 CosyVoice/ACE-Step 本地推理
  # 路由: 根据工作流类型分发到 primary 或 auxiliary
  # ---------------------------------------------------------------------------
  kais-gold-team:
    build:
      context: ../kais-gold-team
      dockerfile: ${AIGC_PLATFORM_DOCKERFILE:-/home/kai/.openclaw/workspace/kais-aigc-platform/docker/gold-team/Dockerfile}
    container_name: kais-gold-team
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GOLD_TEAM_PORT:-8002}:8002"
    env_file: .env
    environment:
      PORT: 8002
      # 双 ComfyUI 引擎端点
      COMFYUI_PRIMARY_HOST: comfyui-primary
      COMFYUI_PRIMARY_PORT: "8188"
      COMFYUI_AUX_HOST: comfyui-auxiliary
      COMFYUI_AUX_PORT: "8188"
      # 默认引擎 (向后兼容)
      COMFYUI_URL: http://comfyui-primary:8188
      REDIS_URL: redis://redis:6379
      # Phase 36 follow-up: 对齐 PyTorch 与 nvidia-smi GPU 编号 (PCI 总线序)
      # gold-team 容器虽然通过 HTTP 调 ComfyUI,但也加载了 torch,保持显式声明
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      OUTPUT_DIR: /mnt/agents/output
      MODELS_DIR: /opt/kais/models
      # CosyVoice3 TTS (RL)
      COSYVOICE_ROOT: /opt/CosyVoice
      COSYVOICE_MODEL_DIR: /opt/CosyVoice/pretrained_models/FunAudioLLM/Fun-CosyVoice3-0.5B-2512
      COSYVOICE_LLM_WEIGHT: llm.rl.pt
      MPLCONFIGDIR: /tmp/matplotlib
      # TTS 三轨 — 环境变量 (TrackManager 读取)
      GPTSOVITS_ROOT: /opt/GPT-SoVITS
      CHATTERBOX_ROOT: /opt/chatterbox
      TTS_IDLE_TIMEOUT: "300"
      # ACE-Step 音乐引擎禁用 (避免开机自动 spawn 子进程常驻 23GB 显存)
      # 引擎代码 main.py 用此开关跳过 register/start,日后需要音乐生成再开
      ACESTEP_ENABLED: "false"
    volumes:
      - ${OUTPUT_DIR:-/mnt/agents/output}:/mnt/agents/output
      - ${MODELS_DIR:-/opt/kais/models}:/opt/kais/models:ro
      - ${DATA_MODELS_DIR:-/data/models}:/data/models
      - cosyvoice-models:/opt/CosyVoice/pretrained_models
      # TTS 三轨模型目录挂载
      - ${GPTSOVITS_DIR:-/data/models/GPT-SoVITS}:/opt/GPT-SoVITS
      - ${CHATTERBOX_DIR:-/data/models/chatterbox}:/opt/chatterbox
      - hf-cache:/root/.cache/huggingface
    networks:
      - kais-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]     # GPU 1 = RTX 3090
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      comfyui-primary:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. kais-review-platform (审核平台) — OPTIONAL
  # ---------------------------------------------------------------------------
  kais-review-platform:
    build:
      context: ../kais-review-platform
      dockerfile: Dockerfile
    container_name: kais-review-platform
    restart: unless-stopped
    profiles:
      - review
    ports:
      - "127.0.0.1:${REVIEW_PORT:-8090}:8090"
    env_file: .env
    environment:
      PORT: 8090
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-kais}:${POSTGRES_PASSWORD:-kais}@audit-db:5432/${POSTGRES_DB:-kais_audit}
      API_KEY: ${REVIEW_API_KEY:-kais-review-dev-key}
      JWT_SECRET: ${REVIEW_JWT_SECRET:-kais-review-jwt-dev-2026}
      REDIS_URL: redis://172.18.0.1:6379/0
      OUTPUT_DIR: /mnt/agents/output
    volumes:
      - ${OUTPUT_DIR:-/mnt/agents/output}:/mnt/agents/output:ro
    networks:
      - kais-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      audit-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 5. audit-db (PostgreSQL 15)
  # ---------------------------------------------------------------------------
  audit-db:
    image: postgres:15-alpine
    container_name: kais-audit-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kais}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kais}
      POSTGRES_DB: ${POSTGRES_DB:-kais_audit}
    volumes:
      - audit-data:/var/lib/postgresql/data
    networks:
      - kais-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kais}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 6. redis (缓存 + 消息队列)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kais-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6390:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - kais-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 7. hermes-agent (智能决策引擎)
  # ---------------------------------------------------------------------------
  # 职责: 域隔离决策引擎, 提供 decide/audit/register REST API
  # 基于 local fork of NousResearch/hermes-agent + FastAPI
  # CPU-only, 无状态服务, 无 GPU 依赖
  # 端口: 8080
  # Prerequisite: ensure docker/hermes-agent/hermes-agent-source symlink
  #   points to /data/workspace/hermes-agent (run: make hermes-link)
  # ---------------------------------------------------------------------------
  hermes-agent:
    build:
      context: ./docker/hermes-agent
      dockerfile: Dockerfile
    container_name: kais-hermes-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HERMES_PORT:-8080}:8080"
    env_file: .env
    environment:
      PORT: 8080
      # LLM_* env vars are OPTIONAL overrides. When unset (empty), the
      # wrapper passes None to AIAgent and the fork loads credentials
      # from /app/data/config.yaml + /app/data/.env (the mounted
      # ~/.hermes/ directory). Set these only for ephemeral CI containers
      # that lack a mounted hermes home.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      HERMES_HOME: /app/data
    volumes:
      # Bind-mount the operator's ~/.hermes/ as the fork's HERMES_HOME.
      # The fork reads config.yaml (provider/model), .env (GLM_API_KEY),
      # and auth.json (OAuth) from here, so an operator who already ran
      # `hermes setup` does NOT need to set LLM_API_KEY again. Read-write
      # so domain_register calls (which write domains/<name>/) persist
      # back to the host. This replaces the previous named volume
      # `hermes-data`, which started empty and could not see host config.
      - ${HOME}/.hermes:/app/data
    networks:
      - kais-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # Mock Profiles (开发阶段替代真实 GPU 服务)
  # ===========================================================================
  kais-gold-team-mock:
    build:
      context: .
      dockerfile: docker/gold-team/Dockerfile.mock
    container_name: kais-gold-team-mock
    restart: unless-stopped
    profiles:
      - mock
    ports:
      - "127.0.0.1:${GOLD_TEAM_PORT:-8002}:8002"
    environment:
      PORT: 8002
      MOCK_MODE: "true"
    volumes:
      - ${OUTPUT_DIR:-/mnt/agents/output}:/mnt/agents/output
    networks:
      - kais-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 10. kais-lora-trainer (GPU 1/3090, :8070)
  # ---------------------------------------------------------------------------
  # 职责: FLUX.1-dev LoRA 训练 (角色一致性/风格迁移)
  # GPU: RTX 3090 24GB (fp8_base 模式, ~14GB 显存)
  # 端口: 8070
  # 依赖: sd-scripts (kohya_ss) + FLUX 模型库
  # ---------------------------------------------------------------------------
  lora-trainer:
    image: ${LORA_TRAINER_IMAGE:-kais/lora-trainer:latest}
    build:
      context: ./docker/lora-trainer
      dockerfile: Dockerfile
    container_name: kais-lora-trainer
    restart: "no"  # 按需启动, 不自动重启
    shm_size: "16g"  # DataLoader 需要足够共享内存
    ports:
      - "${LORA_TRAINER_PORT:-8070}:8070"
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      DATA_DIR: "/data"
      MODELS_DIR: "/data/models/comfyui"
      SD_SCRIPTS_DIR: "/opt/sd-scripts"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      NO_PROXY: "localhost,127.0.0.1,172.18.0.0/16"
    volumes:
      - ${DATA_MODELS_DIR:-/data/models/comfyui}:/data/models/comfyui:ro
      - ${DATA_DIR:-/data}/datasets:/data/datasets:rw
      - ${DATA_DIR:-/data}/output/lora:/data/output/lora:rw
      - ${DATA_DIR:-/data}/logs/lora-train:/data/logs/lora-train:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    networks:
      - kais-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8070/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - training
    # ⚠️ 训练时需确保 GPU 1 (3090) 有足够显存 (>15GB free)
    # 建议先停 comfyui-primary 释放 VRAM:
    #   docker stop comfyui-primary

# =============================================================================
# Networks
# =============================================================================
networks:
  kais-net:
    name: kais-net
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  audit-data:
    name: kais-audit-data
  redis-data:
    name: kais-redis-data
  # core-data volume removed with kais-core-backend (2026-06-28)
  cosyvoice-models:
    name: kais-cosyvoice-models
  comfyui-cache:
    name: kais-comfyui-cache
  comfyui-user:
    name: kais-comfyui-user
  hf-cache:
    name: kais-hf-cache
