# ci.yml — KAP 基础 CI 底线（Phase 0 / P1，2026-08-25）
#
# 评估报告（2026-08-25 glm-ci-gates-eval.md）结论：本仓零件齐全（tsc/esbuild/
# node:test/verify:*），缺的只是「有人在你 push 时跑它们」。迭代模式是直推
# master —— 所以触发分支必须是 master（debug.yml 曾写 main/dev，结构性永不
# 触发，2.5 个月零 run）。
#
# 步骤全部本机 dry-run 实测后才写入：
#   npx tsc --noEmit                        → exit 0（strict 已开，~2.4s）
#   npm run build:server                    → exit 0；产物 data/serve/app.js，
#                                             data/serve/ 已在 .gitignore（63 行），
#                                             不污染 checkout
#   node --import tsx --test "src/**/*.test.ts"
#                                          → 42 tests / 0 fail（glob 由 node
#                                             自展开，yml 里必须保留引号）
#   npm run verify:schema-drift             → 10/10
#   npm run verify:phase-65                 → 31/31
#
# 跨仓契约（schema-drift / phase-65 / manifest-contract）依赖两个 private
# 兄弟仓。鉴权用只读 deploy key（非个人 PAT）：每仓一把 ed25519，read_only，
# 公钥挂在目标仓 Settings→Deploy keys，私钥只存于 Actions secrets：
#   CROSS_REPO_KEY_SKILLS   → kais-hermes-skills
#   CROSS_REPO_KEY_GOLDTEAM → kais-gold-team
# （GitHub 禁止同一把 deploy key 挂第二仓，故两把。）hermes-agent 是 public
# fork，默认匿名 checkout 即可。
# 干净环境实测套件还需要 pip: pytest httpx pyjwt pydantic ruamel.yaml
#   requests rich numpy pyyaml + PYTHONPATH=hermes-agent
# 缺 key 时对应步骤跳过并打 ::warning::（不静默、不假绿）。2026-08-25 已配齐。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # 间接探测 secret 是否存在（secrets 不能直接进 if 条件）
      CROSS_KEY_SKILLS: ${{ secrets.CROSS_REPO_KEY_SKILLS }}
      CROSS_KEY_GOLD: ${{ secrets.CROSS_REPO_KEY_GOLDTEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps：收尾 dry-run 实测裸 npm ci 报 ERESOLVE ——
        # @rmp135/sql-ts@2.2.0 peerOptional sqlite3@^5.1.7 与根依赖
        # sqlite3@^6.0.1 冲突；现有 node_modules 即按此方式安装。
        # 另注：lockfile 509 项 resolved 指向 registry.npmmirror.com（公开
        # 可达）；如 CI 拉取抖动，根治办法是对官方源重建 lockfile。
        run: npm ci --legacy-peer-deps

      - name: Type check (tsc --noEmit, strict)
        run: npx tsc --noEmit

      - name: Build check (esbuild bundle → data/serve/, gitignored)
        run: npm run build:server

      - name: Unit tests (node:test, src/**)
        run: node --import tsx --test "src/**/*.test.ts"

      # ── 跨仓契约（可选，需只读 deploy key secrets）──────────
      # verify:schema-drift 硬编码兄弟仓 KMC 路径、verify:phase-65 硬编码
      # gold-team 路径（各自脚本支持 env 覆盖，首跑实证 hosted 必红）
      # —— 全部收进本条件门。
      - name: Checkout sibling KMC repo (contract source)
        if: env.CROSS_KEY_SKILLS != ''
        uses: actions/checkout@v4
        with:
          repository: kaiger666888/kais-hermes-skills
          ssh-key: ${{ secrets.CROSS_REPO_KEY_SKILLS }}
          path: .ci-sibling/kais-hermes-skills

      - name: Checkout hermes-agent (provides `tools` package)
        if: env.CROSS_KEY_SKILLS != ''
        uses: actions/checkout@v4
        with:
          repository: kaiger666888/hermes-agent
          path: .ci-sibling/hermes-agent

      # hermes-agent 的 plugins/ 是「常规包」(有 __init__.py)，其指向 KMC
      # 插件的 symlink 农场从未进 git（本机手工建，PEP 420 下常规包恒压过
      # KMC 的命名空间包 plugins/ —— 与 sys.path 顺序无关）。干净检出后
      # 农场为空 → from plugins.review_gates... 必 ModuleNotFoundError。
      # 此步按本地形态重建缺失链接（只补缺，不覆盖 hermes-agent 自有插件）。
      - name: Rebuild hermes-agent plugin farm (untracked upstream)
        if: env.CROSS_KEY_SKILLS != ''
        run: |-
          cd .ci-sibling/hermes-agent/plugins
          for d in ../../kais-hermes-skills/plugins/*/; do
            name=$(basename "$d")
            [ -e "$name" ] || ln -s "../../kais-hermes-skills/plugins/$name" "$name"
          done
          ls -la | grep '\->' || true

      - name: Set up Python (manifest suite)
        if: env.CROSS_KEY_SKILLS != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install manifest-suite Python deps
        if: env.CROSS_KEY_SKILLS != ''
        run: >-
          python3 -m pip install pytest httpx pyjwt pydantic ruamel.yaml
          requests rich numpy pyyaml

      - name: Checkout gold-team repo (engine contract source)
        if: env.CROSS_KEY_GOLD != ''
        uses: actions/checkout@v4
        with:
          repository: kaiger666888/kais-gold-team
          ssh-key: ${{ secrets.CROSS_REPO_KEY_GOLDTEAM }}
          path: .ci-sibling/kais-gold-team

      - name: Verify schema drift (cross-repo)
        if: env.CROSS_KEY_SKILLS != ''
        env:
          KAIS_HERMES_SKILLS_PATH: ${{ github.workspace }}/.ci-sibling/kais-hermes-skills
        run: npm run verify:schema-drift

      - name: Verify phase-65 contract (needs gold-team repo)
        if: env.CROSS_KEY_GOLD != ''
        env:
          KAIS_GOLD_TEAM_PATH: ${{ github.workspace }}/.ci-sibling/kais-gold-team
        run: npm run verify:phase-65

      - name: Verify manifest contract (cross-repo)
        if: env.CROSS_KEY_SKILLS != ''
        env:
          KAIS_HERMES_SKILLS_PATH: ${{ github.workspace }}/.ci-sibling/kais-hermes-skills
          # conftest 会把 KMC 仓根插到 sys.path 最前，KMC 的 plugins
          # namespace 包优先于 hermes-agent 的同名 regular 包
          PYTHONPATH: ${{ github.workspace }}/.ci-sibling/hermes-agent
        run: npm run verify:manifest-contract

      - name: Notice — cross-repo contracts skipped (deploy key missing)
        if: env.CROSS_KEY_SKILLS == '' || env.CROSS_KEY_GOLD == ''
        run: >-
          echo "::warning::some cross-repo contract steps skipped — set the
          CROSS_REPO_KEY_SKILLS / CROSS_REPO_KEY_GOLDTEAM secrets (read-only
          deploy keys for the respective private repos) to enable them."
