# =============================================================================
# KAIS AIGC Platform V8.0 — Docker Compose (Gold-Team Independent)
# =============================================================================
# 变更 (vs V6):
#   - 移除 kais-movie-agent（编排职责已迁移到 OpenClaw skill）
#   - 保留 kais-core-backend（内容管理: Toonflow UI、无限画布、API 网关）
#   - gold-team 可独立启动，不依赖 movie-agent
#   - review-platform 标记为 optional
#
# 架构:
#   core-backend (内容管理) + gold-team (GPU 执行) + comfyui-worker (推理)
#   redis (队列) + postgres (持久化)
#   review-platform (optional, 审核界面)
#
# 用法:
#   启动核心:  docker compose -f docker-compose.v8.yml up -d
#   仅 gold:   docker compose -f docker-compose.v8.yml up -d gold-team
#   开发 mock: docker compose -f docker-compose.v8.yml --profile mock up -d
#   停止:      docker compose -f docker-compose.v8.yml down
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 0. kais-core-backend (内容管理层)
  # ---------------------------------------------------------------------------
  # 原有 Toonflow 项目，剥离 Electron 后的纯后端服务
  # 负责: 项目管理、角色管理、分镜管理、无限画布、API 网关
  # 编排已迁移到 OpenClaw skill，此服务仅负责内容 CRUD + 前端 serve
  # 不需要 GPU
  # ---------------------------------------------------------------------------
  kais-core-backend:
    build:
      context: .
      dockerfile: docker/core-backend/Dockerfile
    container_name: kais-core-backend
    restart: unless-stopped
    ports:
      - "${CORE_PORT:-8000}:8000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8000
      REDIS_URL: redis://redis:6379
      GOLD_TEAM_URL: http://kais-gold-team:8002
      REVIEW_PLATFORM_URL: http://kais-review-platform:8090
      DATABASE_URL: postgresql://${POSTGRES_USER:-kais}:${POSTGRES_PASSWORD:-kais}@audit-db:5432/${POSTGRES_DB:-kais_audit}
    volumes:
      - core-data:/app/data                              # Toonflow 项目数据 (SQLite 等)
      - ${OUTPUT_DIR:-/mnt/agents/output}:/mnt/agents/output  # 共享产物目录
    networks:
      - kais-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      audit-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 1. kais-gold-team (统一执行 Agent) — 核心服务
  # ---------------------------------------------------------------------------
  # 负责: 调用 ComfyUI / 云端引擎执行图片/视频/音频生成任务
  # 需要 GPU 1 (RTX 3090) — 用于本地推理加速
  # Redis Streams 消费者，接收 gold-team 任务
  # ---------------------------------------------------------------------------
  kais-gold-team:
    build:
      context: ../kais-gold-team
      dockerfile: /home/kai/.openclaw/workspace/kais-aigc-platform/docker/gold-team/Dockerfile
    container_name: kais-gold-team
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GOLD_TEAM_PORT:-8002}:8002"
    env_file: .env
    environment:
      PORT: 8002
      COMFYUI_URL: http://comfyui-worker:8188
      REDIS_URL: redis://redis:6379
      OUTPUT_DIR: /mnt/agents/output
      MODELS_DIR: /opt/kais/models
      # CosyVoice3 TTS (RL)
      COSYVOICE_ROOT: /opt/CosyVoice
      COSYVOICE_MODEL_DIR: /opt/CosyVoice/pretrained_models/FunAudioLLM/Fun-CosyVoice3-0.5B-2512
      COSYVOICE_LLM_WEIGHT: llm.rl.pt
      # ACE-Step music generation
      ACESTEP_ROOT: /opt/acestep
      ACESTEP_API_HOST: 127.0.0.1
      ACESTEP_API_PORT: 8010
      ACESTEP_CONFIG_PATH: acestep-v15-turbo
      ACESTEP_CHECKPOINTS: /opt/acestep/checkpoints
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ${OUTPUT_DIR:-/mnt/agents/output}:/mnt/agents/output
      - ${MODELS_DIR:-/opt/kais/models}:/opt/kais/models:ro
      - ${DATA_MODELS_DIR:-/data/models}:/data/models
      - cosyvoice-models:/opt/CosyVoice/pretrained_models
      - acestep-checkpoints:/opt/acestep/checkpoints
    networks:
      - kais-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]     # GPU 1 = RTX 3090
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      comfyui-worker:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 2. comfyui-worker (ComfyUI 推理引擎) — gold-team 依赖
  # ---------------------------------------------------------------------------
  comfyui-worker:
    build:
      context: .
      dockerfile: docker/comfyui-worker/Dockerfile
    image: comfyui-worker:pytorch251-v3
    container_name: comfyui-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    env_file: .env
    environment:
      COMFYUI_LISTEN: "0.0.0.0"
      COMFYUI_PORT: 8188
      OUTPUT_DIR: /mnt/agents/output
      MODELS_DIR: /opt/kais/models
    volumes:
      - ${OUTPUT_DIR:-/mnt/agents/output}:/mnt/agents/output
      - ${MODELS_DIR:-/opt/kais/models}:/opt/kais/models
      - ${DATA_MODELS_DIR:-/data/models}:/data/models
      - comfyui-custom-nodes:/app/ComfyUI/custom_nodes
      - comfyui-models:/app/ComfyUI/models
    networks:
      - kais-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]     # GPU 1 = RTX 3090
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8188/system_stats')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # 3. kais-review-platform (审核平台) — OPTIONAL
  # ---------------------------------------------------------------------------
  # 按需启动: docker compose -f docker-compose.v8.yml up -d review-platform
  # ---------------------------------------------------------------------------
  kais-review-platform:
    build:
      context: ../kais-review-platform
      dockerfile: Dockerfile
    container_name: kais-review-platform
    restart: unless-stopped
    profiles:
      - review        # 按需启动，不在默认 up 中
    ports:
      - "127.0.0.1:${REVIEW_PORT:-8090}:8090"
    env_file: .env
    environment:
      PORT: 8090
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-kais}:${POSTGRES_PASSWORD:-kais}@audit-db:5432/${POSTGRES_DB:-kais_audit}
      API_KEY: ${REVIEW_API_KEY:-kais-review-dev-key}
      JWT_SECRET: ${REVIEW_JWT_SECRET:-kais-review-jwt-dev-2026}
      REDIS_URL: redis://172.18.0.1:6379/0
      OUTPUT_DIR: /mnt/agents/output
    volumes:
      - ${OUTPUT_DIR:-/mnt/agents/output}:/mnt/agents/output:ro
    networks:
      - kais-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      audit-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. audit-db (PostgreSQL 15)
  # ---------------------------------------------------------------------------
  audit-db:
    image: postgres:15-alpine
    container_name: kais-audit-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kais}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kais}
      POSTGRES_DB: ${POSTGRES_DB:-kais_audit}
    volumes:
      - audit-data:/var/lib/postgresql/data
    networks:
      - kais-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kais}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 5. redis (缓存 + 消息队列)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kais-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6390:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - kais-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # Mock Profiles (开发阶段替代真实 GPU 服务)
  # ===========================================================================
  kais-gold-team-mock:
    build:
      context: .
      dockerfile: docker/gold-team/Dockerfile.mock
    container_name: kais-gold-team-mock
    restart: unless-stopped
    profiles:
      - mock
    ports:
      - "127.0.0.1:${GOLD_TEAM_PORT:-8002}:8002"
    environment:
      PORT: 8002
      MOCK_MODE: "true"
    volumes:
      - ${OUTPUT_DIR:-/mnt/agents/output}:/mnt/agents/output
    networks:
      - kais-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  comfyui-worker-mock:
    build:
      context: .
      dockerfile: docker/comfyui-worker/Dockerfile.mock
    container_name: comfyui-worker-mock
    restart: unless-stopped
    profiles:
      - mock
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    environment:
      MOCK_MODE: "true"
    networks:
      - kais-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8188/system_stats')"]
      interval: 15s
      timeout: 5s
      retries: 3

# =============================================================================
# Networks
# =============================================================================
networks:
  kais-net:
    name: kais-net
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  audit-data:
    name: kais-audit-data
  redis-data:
    name: kais-redis-data
  core-data:
    name: kais-core-data
  comfyui-custom-nodes:
    name: kais-comfyui-custom-nodes
  comfyui-models:
    name: kais-comfyui-models
  cosyvoice-models:
    name: kais-cosyvoice-models
  acestep-checkpoints:
    name: kais-acestep-checkpoints
